<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钓鱼大师 · 从鱼塘到大海</title>
<style>
:root{
  --bg:#0e2a3a; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --gold:#ffd766; --text:#eaf4ff; --muted:#9db8c9; --accent:#4fc3f7;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%, #17455f, #0a1e2c 60%, #07131d);
  color:var(--text); min-height:100vh; overflow-x:hidden;
}
#app{max-width:720px; margin:0 auto; padding:14px 14px 40px;}

/* ===== 顶部状态栏 ===== */
header{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:12px 16px; backdrop-filter:blur(8px);
}
.level-badge{
  flex:none; width:58px; height:58px; border-radius:14px; display:grid; place-items:center;
  background:linear-gradient(135deg,#ffb74d,#ff7043); font-weight:800; font-size:26px;
  color:#3a1f00; box-shadow:0 4px 18px rgba(255,140,0,.35);
}
.stats{flex:1; min-width:200px;}
.stats .row{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin:2px 0;}
.stats .row b{color:var(--text); font-size:14px;}
.expbar{height:10px; background:rgba(0,0,0,.35); border-radius:6px; overflow:hidden; margin:6px 0 2px;}
.expbar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#4fc3f7,#00e676); border-radius:6px; transition:width .5s ease;}
.title-line{font-size:12px; color:var(--muted);}
.ach-btn{
  flex:none; padding:8px 12px; border-radius:10px; background:rgba(255,215,102,.15);
  border:1px solid rgba(255,215,102,.4); color:var(--gold); font-size:13px; cursor:pointer;
}
.ach-btn:hover{background:rgba(255,215,102,.25);}

/* ===== 场景区 ===== */
#scene{
  position:relative; margin-top:14px; border-radius:20px; overflow:hidden;
  height:300px; background:#0a3a55; border:1px solid var(--line);
  box-shadow:0 10px 40px rgba(0,0,0,.4); cursor:pointer; user-select:none;
}
#scene svg.bg{position:absolute; inset:0; width:100%; height:100%;}
#scene .scene-title{
  position:absolute; left:14px; bottom:12px; font-size:15px; font-weight:600; color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.6); background:rgba(0,0,0,.25); padding:5px 12px; border-radius:20px;
}
#scene .hint{position:absolute; left:14px; top:12px; font-size:12px; color:#cfe9ff; opacity:.9; background:rgba(0,0,0,.25); padding:4px 10px; border-radius:14px;}

/* 鱼竿（场景内 SVG group）动画由 JS 驱动 */
/* 浮漂浮动 */
#bobberFloat{ /* 无 attribute transform，交给 CSS */ }
#bobberFloat.floaty{ animation:floaty 2.4s ease-in-out infinite; }
@keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
#bobberFloat.bite{ animation:bobberbite .45s ease 5; }
@keyframes bobberbite{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(10px);} }

/* 鱼跃出水 */
#jump{position:absolute; width:130px; opacity:0; pointer-events:none; transition:none; z-index:5;}
#jump.show{animation:jump 1.15s ease-out forwards;}
@keyframes jump{
  0%{opacity:0; transform:translateY(40px) rotate(-8deg);}
  30%{opacity:1; transform:translateY(-70px) rotate(6deg);}
  65%{opacity:1; transform:translateY(-120px) rotate(10deg);}
  100%{opacity:0; transform:translateY(40px) rotate(14deg);}
}

/* ===== 鱼池选择 ===== */
#ponds{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px;}
.pond{
  position:relative; text-align:center; padding:12px 4px 10px; border-radius:14px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); transition:.2s; user-select:none;
}
.pond .pi{font-size:30px; line-height:1;}
.pond .pn{font-size:12px; margin-top:6px; color:var(--muted);}
.pond .lv{font-size:10px; color:var(--gold); opacity:.8;}
.pond.active{border-color:var(--accent); background:rgba(79,195,247,.12); transform:translateY(-3px); box-shadow:0 6px 18px rgba(79,195,247,.2);}
.pond.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.6);}
.pond.locked::after{content:"🔒"; position:absolute; top:4px; right:6px; font-size:14px;}

/* ===== 速度选择 ===== */
#speedbar{display:flex; align-items:center; gap:8px; margin-top:14px;}
#speedbar .sp-label{font-size:13px; color:var(--muted); flex:none;}
.sp-btn{flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-weight:700; cursor:pointer; font-size:14px; transition:.15s;}
.sp-btn:hover{background:rgba(255,255,255,.1);}
.sp-btn.active{background:var(--accent); color:#042332; border-color:var(--accent); box-shadow:0 4px 12px rgba(79,195,247,.3);}

/* ===== 操作按钮 ===== */
#controls{margin-top:12px; display:flex; gap:10px;}
.btn{
  flex:1; padding:16px; border:none; border-radius:16px; font-size:17px; font-weight:700; cursor:pointer;
  color:#04230e; background:linear-gradient(135deg,#7eea8a,#2ecc71); box-shadow:0 6px 20px rgba(46,204,113,.35);
  transition:.15s; letter-spacing:1px;
}
.btn:active{transform:scale(.97);}
.btn:disabled{background:#35505e; color:#8aa3b0; box-shadow:none; cursor:not-allowed;}
.btn.sec{flex:.7; background:var(--panel); color:var(--text); border:1px solid var(--line); box-shadow:none;}
.btn.reel{background:linear-gradient(135deg,#ffd54f,#ff9800); color:#4a2600; box-shadow:0 6px 20px rgba(255,152,0,.45); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}

/* ===== 弹窗 ===== */
#mask{position:fixed; inset:0; background:rgba(4,14,22,.72); backdrop-filter:blur(4px); display:none;
  align-items:center; justify-content:center; z-index:50; padding:20px;}
#mask.on{display:flex;}
.modal{
  width:100%; max-width:400px; background:linear-gradient(160deg,#123a4d,#0d2634); border:1px solid var(--line);
  border-radius:22px; padding:22px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6); animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.9); opacity:0;}to{transform:scale(1); opacity:1;}}
.modal h2{margin:4px 0 2px; font-size:22px;}
.modal .sub{color:var(--muted); font-size:13px; margin-bottom:12px;}
.modal .imgbox{width:180px; height:150px; margin:8px auto; display:grid; place-items:center; border-radius:16px;
  background:radial-gradient(circle at 50% 60%, rgba(79,195,247,.15), transparent 70%);}
.modal .imgbox svg{width:100%; height:100%; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.modal .fact{font-size:14px; margin:6px 0;}
.modal .fact b{color:var(--gold);}
.modal .exp-line{font-size:13px; color:#7eea8a; margin:4px 0;}
.modal .ach-line{margin-top:8px; padding:8px 12px; border-radius:12px; background:rgba(255,215,102,.14); border:1px solid rgba(255,215,102,.4);
  color:var(--gold); font-size:13px; font-weight:600;}
.modal .actions{display:flex; gap:10px; margin-top:16px;}
.modal .actions .btn{flex:1; padding:13px; font-size:15px;}
.modal .actions .btn.bad{background:linear-gradient(135deg,#ff8a65,#e53935); color:#fff;}
.modal.rare{border-color:rgba(255,215,102,.8); box-shadow:0 0 40px rgba(255,200,60,.35);}
.modal.rare h2{color:var(--gold);}

/* ===== 成就面板 ===== */
#ach-panel{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(4,14,22,.78); padding:20px;}
#ach-panel.on{display:flex;}
.ach-inner{width:100%; max-width:440px; max-height:84vh; overflow-y:auto; background:#0d2634; border:1px solid var(--line); border-radius:20px; padding:20px;}
.ach-inner h2{text-align:center; font-size:20px; margin:0 0 4px;}
.ach-inner .sub{text-align:center; color:var(--muted); font-size:12px; margin-bottom:14px;}
.ach-item{display:flex; gap:12px; align-items:center; padding:11px 12px; border-radius:12px; background:var(--panel); margin-bottom:9px; border:1px solid var(--line);}
.ach-item .icon{font-size:26px;}
.ach-item .n{font-weight:600; font-size:14px;}
.ach-item .d{font-size:12px; color:var(--muted); margin-top:2px;}
.ach-item.locked{opacity:.4; filter:grayscale(1);}
.ach-item .st{margin-left:auto; font-size:13px; color:var(--gold);}
.ach-item.locked .st{color:#5b7180;}

/* 图鉴 */
#book-panel{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(4,14,22,.78); padding:20px;}
#book-panel.on{display:flex;}
.book-inner{width:100%; max-width:460px; max-height:84vh; overflow-y:auto; background:#0d2634; border:1px solid var(--line); border-radius:20px; padding:18px;}
.book-inner h2{text-align:center; font-size:19px; margin:0 0 10px;}
.book-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.book-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center; font-size:11px;}
.book-card svg{width:100%; height:52px; margin-bottom:4px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
.book-card .bc-name{color:var(--text); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.book-card .bc-r{color:var(--gold); font-size:10px; margin-top:2px;}
.book-card.unknown{opacity:.45; filter:grayscale(1);}
.close-x{display:block; margin:14px auto 0; padding:11px 26px; border-radius:12px; border:none; background:var(--accent); color:#042332; font-weight:700; cursor:pointer; font-size:14px;}

.toast{position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); z-index:70; background:rgba(20,40,55,.96);
  border:1px solid var(--gold); color:var(--gold); padding:14px 22px; border-radius:14px; font-weight:700; font-size:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.5); display:none; text-align:center; animation:pop .3s ease; pointer-events:none;}
.toast.on{display:block;}

@media(max-width:520px){ #scene{height:250px;} .pond .pn{font-size:10px;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="level-badge" id="lvBadge">1</div>

      <div class="row"><span id="lvTitle">1级 · 家养小鱼池</span><b><span id="expNow">0</span> / <span id="expNeed">100</span> 经验</b></div>
      <div class="expbar"><i id="expFill"></i></div>
      <div class="title-line">🎣 <span id="rankName">竹制手竿</span> · ☀️ 晒龄 <span id="sunLevel">0</span> · 🏆 <span id="achCount">0</span>/8 · 🪖 空军 <span id="blankCount">0</span></div>
    </div>
    <button class="ach-btn" onclick="openAch()">🏆 成就</button>

  <div id="scene" onclick="onCastClick()">

    <span class="sp-label">⏩ 速度</span>

    <button class="sp-btn" data-s="3" onclick="setSpeed(3)">3×</button>
    <button class="sp-btn" data-s="4" onclick="setSpeed(4)">4×</button>
  </div>

  <div id="controls">

    <button class="btn sec" onclick="openBook()">📖 图鉴</button>
  </div>
</div>

<!-- 结果弹窗 -->
<div id="mask">
  <div class="modal" id="modal">
    <h2 id="mTitle">钓到鱼了！</h2>

    <div class="exp-line" id="mExp"></div>
    <div class="ach-line" id="mAch" style="display:none"></div>
    <div class="actions" id="mActions"></div>
  </div>
</div>

<!-- 成就面板 -->
<div id="ach-panel">
  <div class="ach-inner">
    <h2>🏆 成就</h2>
    <div class="sub">钓鱼佬的一生，就是一条不断空军的不归路</div>
    <div id="achList"></div>
    <button class="close-x" onclick="closeAch()">关闭</button>
  </div>
</div>

<!-- 图鉴面板 -->
<div id="book-panel">
  <div class="book-inner">
    <h2>📖 鱼类图鉴</h2>
    <div class="book-grid" id="bookGrid"></div>
    <button class="close-x" onclick="document.getElementById('book-panel').classList.remove('on')">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const SKIN_STAGES = [
  [0,      '#ffe1c4'],
  [400,    '#f4c594'],
  [1600,   '#e0a86e'],
  [6000,   '#c0804c'],
  [20000,  '#9a5c34'],
  [60000,  '#73401f'],
  [180000, '#4a2712'],
];
function mixColor(a,b,t){ const ca=hex(a), cb=hex(b); return rgb(ca[0]+(cb[0]-ca[0])*t, ca[1]+(cb[1]-ca[1])*t, ca[2]+(cb[2]-ca[2])*t); }
function skinColor(exp){
  if(exp<=SKIN_STAGES[0][0]) return SKIN_STAGES[0][1];
  for(let i=0;i<SKIN_STAGES.length-1;i++){
    const [e0,c0]=SKIN_STAGES[i], [e1,c1]=SKIN_STAGES[i+1];
    if(exp>=e0 && exp<=e1) return mixColor(c0,c1,(exp-e0)/(e1-e0));
  }
  return SKIN_STAGES[SKIN_STAGES.length-1][1];
}

function hex(h){ const s=h.replace('#',''); return [parseInt(s.substr(0,2),16),parseInt(s.substr(2,2),16),parseInt(s.substr(4,2),16)]; }
function rgb(r,g,b){ return '#'+[r,g,b].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join(''); }
function lighten(h){ const c=hex(h); return rgb(c[0]+(255-c[0])*.35, c[1]+(255-c[1])*.35, c[2]+(255-c[2])*.35); }
function darken(h){ const c=hex(h); return rgb(c[0]*.55, c[1]*.55, c[2]*.55); }

/* ================= 核心玩法 ================= */
function expFor(f,w){
  const t=(w-f.wMin)/(f.wMax-f.wMin);
  let e=Math.round(f.eMin+t*(f.eMax-f.eMin));
  if(f.rare) e=Math.round(e*f.rare.mult);
  return e;
}
function pickFish(){
  const list=LISTS[state.level];
  const i=INTERFERE[state.level];
  if(Math.random()<i.p) return {int:true};
  const rares=list.filter(f=>f.rare);
  for(const f of rares){ if(Math.random()<0.01) return {fish:f,rare:true}; }
  const normals=list.filter(f=>!f.rare);
  return {fish:normals[Math.floor(Math.random()*normals.length)],rare:false};
}
function randW(f){ return +(f.wMin+Math.random()*(f.wMax-f.wMin)).toFixed(1); }

function animateRod(angles,dur){
  const rod=document.getElementById('rodGroup');
  if(rod) rod.setAttribute('transform',`rotate(${angles[0]} ${ROD_ORIGIN})`);
  clearInterval(_rodT);
  const frames=angles.length-1, per=dur/frames;
  let i=0;
  _rodT=setInterval(()=>{ i++; rod.setAttribute('transform',`rotate(${angles[i]} ${ROD_ORIGIN})`); if(i>=frames) clearInterval(_rodT); },per);
}

function onCastClick(){
  if(fishingState==='hooked') reel();
  else if(fishingState==='idle' && !busy) cast();
}

let waitEnd0=0;
function cast(){
  busy=true; fishingState='waiting';
  const bf=document.getElementById('bobberFloat');
  bf.classList.remove('bite'); bf.classList.add('floaty');
  animateRod([0,-30,14,-6,0], 1100);
  const ms=(10000+Math.random()*20000)/(state.speed||1);
  waitEnd0=Date.now()+ms;
  setHint('静候鱼上钩…约 '+Math.round(ms/1000)+' 秒');
  renderCastBtn();
  fishInterval=setInterval(()=>{
    const left=Math.max(0,Math.ceil((waitEnd0-Date.now())/1000));
    setHint('静候鱼上钩…约 '+left+' 秒');
    renderCastBtn();
    if(Date.now()>=waitEnd0){ clearInterval(fishInterval); fishInterval=null; onHooked(); }
  },300);
}

function onHooked(){
  fishingState='hooked';
  const bf=document.getElementById('bobberFloat');
  bf.classList.remove('floaty'); bf.classList.add('bite');
  setHint('🐟 有鱼上钩了！快收杆！');
  toast('🐟 有鱼上钩了！快收杆！');
  renderCastBtn();
}

function reel(){
  if(fishingState!=='hooked') return;
  if(fishInterval){ clearInterval(fishInterval); fishInterval=null; }
  fishingState='idle';
  const bf=document.getElementById('bobberFloat');
  bf.classList.remove('bite','floaty');
  animateRod([0,-34,-12,0], 700);
  // 跑鱼判定
  if(Math.random()<ESCAPE_RATE){ showEscape(); renderCastBtn(); return; }
  const result=pickFish();
  if(result.int){ showInterfere(); renderCastBtn(); return; }
  const w=randW(result.fish), e=expFor(result.fish,w);
  showJump(result.fish,result.rare);
  setTimeout(()=>showCatch(result.fish,w,e,result.rare),950);
  renderCastBtn();
}

function showJump(f,rare){
  const jump=document.getElementById('jump');
  jump.style.left='40%'; jump.style.top='16%';
  jump.innerHTML=`<div style="width:120px;height:110px;${rare?'filter:drop-shadow(0 0 12px #ffd766)':''}">${fishSVG(f)}</div>`;
  jump.classList.remove('show'); void jump.offsetWidth; jump.classList.add('show');
  setTimeout(()=>jump.classList.remove('show'),1200);
}

function showEscape(){
  const m=document.getElementById('modal');
  m.classList.remove('rare');
  document.getElementById('mTitle').textContent='💨 鱼跑了！';
  document.getElementById('mSub').textContent='收竿太急，鱼挣脱鱼钩';
  document.getElementById('mImg').innerHTML=`<div style="width:150px;height:120px;display:grid;place-items:center;font-size:64px">🪝</div>`;
  document.getElementById('mFact').innerHTML='这次<b>空军</b>了，再接再厉！';
  document.getElementById('mExp').textContent='';
  document.getElementById('mAch').style.display='none';
  document.getElementById('mActions').innerHTML=`<button class="btn" onclick="closeModal()">继续钓鱼</button>`;
  openModal();
}

function showCatch(f,w,exp,rare){
  state.caught[f.n]=true;
  state.exp+=exp; state.totalExp+=exp;
  let achLine='';
  if(f.rare && f.rare.ach){ unlockAch(f.rare.ach); achLine=f.rare.ach; }
  checkLevelUp();
  save(); renderHeader(); renderScene();
  const m=document.getElementById('modal');
  m.classList.toggle('rare',!!rare);
  document.getElementById('mTitle').textContent=rare?'✨ 稀有鱼上钩！':'🐟 钓到鱼了！';
  document.getElementById('mSub').textContent=POND_META[state.level].name;
  document.getElementById('mImg').innerHTML=`<div style="width:170px;height:130px;${rare?'filter:drop-shadow(0 0 14px #ffd766)':''}">${fishSVG(f)}</div>`;
  document.getElementById('mFact').innerHTML=`你钓到一条 <b>${f.n}</b>，重 <b>${w} kg</b>`;
  document.getElementById('mExp').innerHTML=`+${exp} 经验`+(rare?'（稀有 ×'+f.rare.mult+'）':'');
  document.getElementById('mAch').style.display=achLine?'block':'none';
  document.getElementById('mAch').textContent='🏆 获得成就：'+achLine;
  document.getElementById('mActions').innerHTML=`<button class="btn" onclick="closeModal()">收下！</button>`;
  openModal();
}

function showInterfere(){
  const i=INTERFERE[state.level];
  if(i.ach){ unlockAch(i.ach); renderHeader(); }
  save(); renderHeader();
  const m=document.getElementById('modal');
  m.classList.remove('rare');
  document.getElementById('mTitle').textContent='⚠️ 突发事件！';
  document.getElementById('mSub').textContent=i.name;
  document.getElementById('mImg').innerHTML=`<div style="width:200px;height:140px">${interfereSVG(state.level)}</div>`;
  document.getElementById('mFact').innerHTML=i.desc+'<br>将扣除 <b style="color:#ff8a65">'+Math.abs(i.exp)+'</b> 经验';
  document.getElementById('mExp').textContent='';
  document.getElementById('mAch').style.display=i.ach?'block':'none';
  document.getElementById('mAch').textContent=i.ach?('🏆 获得成就：'+i.ach):'';
  document.getElementById('mActions').innerHTML=
    `<button class="btn" onclick="choosePeace(${i.exp})">🪖 我空军我骄傲</button>
     <button class="btn bad" onclick="choosePay(${i.exp})">算我倒霉</button>`;
  openModal();
}
function choosePeace(exp){
  state.blank++;
  if(state.blank>=3) unlockAch('钓鱼界空军佬');
  save(); renderHeader();
  toast('🪖 我空军我骄傲！不扣经验');
  closeModal();
}
function choosePay(exp){
  state.exp=Math.max(0,state.exp+exp);
  save(); renderHeader(); renderScene();
  toast('💸 扣除 '+Math.abs(exp)+' 经验');
  closeModal();
}

function checkLevelUp(){
  let up=false;
  while(state.level<5 && state.exp>=LEVEL_REQ[state.level+1]){
    state.exp-=LEVEL_REQ[state.level+1];
    state.level++;
    up=true;
  }
  if(up){ toast('🎉 升级啦！Lv.'+state.level+' · 解锁'+RODS[state.level].name); renderPonds(); }
}

/* ================= 弹窗 / 面板 ================= */
function openModal(){ document.getElementById('mask').classList.add('on'); }
function closeModal(){ document.getElementById('mask').classList.remove('on'); busy=false; renderAll(); setHint('点击水面抛竿'); }
function openAch(){ renderAch(); document.getElementById('ach-panel').classList.add('on'); }
function closeAch(){ document.getElementById('ach-panel').classList.remove('on'); }
function renderAch(){
  const c=document.getElementById('achList'); c.innerHTML='';
  ACH.forEach(a=>{
    const ok=!!state.ach[a.id];
    const d=document.createElement('div');
    d.className='ach-item'+(ok?'':' locked');
    d.innerHTML=`<div class="icon">${a.icon}</div><div><div class="n">${a.id}</div><div class="d">${a.d}</div></div><div class="st">${ok?'✔ 已达成':'未达成'}</div>`;
    c.appendChild(d);
  });
}
function openBook(){
  const c=document.getElementById('bookGrid'); c.innerHTML='';
  for(const lv in LISTS){
    LISTS[lv].forEach(f=>{
      const known=!!state.caught[f.n];
      const d=document.createElement('div');
      d.className='book-card'+(known?'':' unknown');
      d.innerHTML=known?`<div style="height:52px">${fishSVG(f)}</div><div class="bc-name">${f.n}</div>${f.rare?'<div class="bc-r">★稀有</div>':''}`:`<div style="height:52px;display:grid;place-items:center;font-size:24px">❓</div><div class="bc-name">???</div>`;
      c.appendChild(d);
    });
  }
  document.getElementById('book-panel').classList.add('on');
}
let _toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ================= 启动 ================= */
load();
renderAll();
setHint('点击水面抛竿');
</script>
</body>
</html>
