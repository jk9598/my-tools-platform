<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办清单</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;}
header{background:#42a5f5;color:#fff;text-align:center;padding:15px 0;font-size:1.2em;}
.main{padding:10px;}
.input{display:flex;gap:8px;}
.input input{flex:1;height:44px;font-size:1em;padding:0 10px;}
.input button{height:44px;font-size:1em;background:#66bb6a;color:#fff;border:none;cursor:pointer;}
.filter{margin:10px 0;display:flex;gap:8px;}
.filter button{flex:1;height:44px;font-size:1em;background:#eee;border:none;cursor:pointer;}
.filter .active{background:#ccc;}
ul{list-style:none;margin:0;padding:0;}
li{background:#fff;margin-bottom:8px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:4px;}
li.done span{text-decoration:line-through;color:#999;}
li button{margin-left:auto;background:#e57373;color:#fff;border:none;height:30px;width:30px;border-radius:50%;cursor:pointer;}
</style>
</head>
<body>
<header>待办清单</header>
<div class="main">
<div class="input">
<input id="newTask" type="text" placeholder="新任务">
<button id="addBtn">添加</button>
</div>
<div class="filter">
<button data-mode="all" class="active">全部</button>
<button data-mode="done">完成</button>
<button data-mode="todo">未完成</button>
</div>
<ul id="list"></ul>
</div>
<script>
var tasks=[], mode='all';
const key='tool_todo';
function load(){tasks=JSON.parse(localStorage.getItem(key)||'[]');}
function save(){localStorage.setItem(key,JSON.stringify(tasks));}
function render(){
var ul=document.getElementById('list');ul.innerHTML='';
tasks.filter(t=>mode==='all'?true:(mode==='done'?t.done:!t.done)).forEach(t=>{
var li=document.createElement('li');li.className=t.done?'done':'';
var ch=document.createElement('input');ch.type='checkbox';ch.checked=t.done;
ch.onclick=function(){t.done=this.checked;save();render();};
var txt=document.createElement('span');txt.textContent=t.text;
var del=document.createElement('button');del.textContent='×';
del.onclick=function(){tasks=tasks.filter(e=>e.id!==t.id);save();render();};
li.append(ch,txt,del);
ul.append(li);
});
}
document.getElementById('addBtn').onclick=function(){
var txt=document.getElementById('newTask');var val=txt.value.trim();
if(!val)return;tasks.push({id:Date.now(),text:val,done:false});txt.value='';save();render();
};
document.getElementById('newTask').addEventListener('keyup',e=>{if(e.key==='Enter')document.getElementById('addBtn').click();});
document.querySelectorAll('.filter button').forEach(b=>{
b.onclick=function(){
document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active'));
this.classList.add('active');mode=this.dataset.mode;render();
};
});
load();render();
</script>
</body>
</html>
